name: Refresh TanStack lockfile

on:
  push:
    branches:
      - fix/tanstack-start-security

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: "!contains(github.event.head_commit.message, 'ci: refresh generated Bun lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanstack-start-security
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh generated Bun lockfile"
            git push origin HEAD:fix/tanstack-start-security
          fi
